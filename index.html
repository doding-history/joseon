<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>조선시대 역사 블루마블 - 임진왜란과 병자호란</title>
    <style>
        :root {
            --primary: #8b0000;
            --primary-dark: #5c0000;
            --accent: #d4af37;
            --bg-color: #f4ebd0;
            --board-bg: #fffaf0;
            --tile-border: #8b5a2b;
            --text-dark: #2c2c2c;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Malgun Gothic', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-dark); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 10px; }
        header { text-align: center; margin-bottom: 15px; }
        header h1 { font-size: 1.8rem; color: var(--primary); text-shadow: 1px 1px 2px rgba(0,0,0,0.1); }
        header p { font-size: 0.95rem; color: #555; }
        .container { width: 100%; max-width: 1200px; display: flex; flex-direction: column; gap: 15px; align-items: center; }
        #lobby-screen { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; width: 100%; max-width: 450px; border: 2px solid var(--tile-border); margin-top: 50px; }
        #lobby-screen h2 { margin-bottom: 20px; color: var(--primary); }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
        .btn { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 6px; font-size: 1rem; cursor: pointer; width: 100%; font-weight: bold; transition: background 0.2s; }
        .btn:hover { background: var(--primary-dark); }
        #game-screen { display: none; width: 100%; grid-template-columns: 1fr 320px; gap: 20px; }
        @media(max-width: 900px) { #game-screen { grid-template-columns: 1fr; } }
        .board-container { background: var(--board-bg); border: 4px solid var(--primary-dark); border-radius: 8px; padding: 10px; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); width: 100%; aspect-ratio: 1/1; max-width: 700px; margin: 0 auto; box-shadow: 0 6px 20px rgba(0,0,0,0.15); }
        .tile { border: 1px solid var(--tile-border); padding: 4px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; font-size: 0.75rem; text-align: center; position: relative; background: #fff; overflow: hidden; }
        .tile-header { font-weight: bold; font-size: 0.7rem; color: #fff; width: 100%; padding: 2px 0; border-radius: 2px; }
        .tile-icon { font-size: 1.4rem; margin: 2px 0; display: flex; align-items: center; justify-content: center; height: 30px; }
        .tile-name { font-size: 0.65rem; line-height: 1.1; overflow: hidden; max-height: 24px; }
        .tile.start { background-color: #ffe4e1; } .tile.start .tile-header { background: #b22222; }
        .tile.quiz { background-color: #e0f7fa; } .tile.quiz .tile-header { background: #00838f; }
        .tile.event { background-color: #fff9c4; } .tile.event .tile-header { background: #fbc02d; color: #333; }
        .tile.jail { background-color: #efebe9; } .tile.jail .tile-header { background: #4e342e; }
        .control-panel { display: flex; flex-direction: column; gap: 15px; }
        .panel-box { background: white; border: 2px solid var(--tile-border); border-radius: 8px; padding: 15px; box-shadow: 0 3px 10px rgba(0,0,0,0.05); }
        .status-header { font-size: 1.1rem; font-weight: bold; color: var(--primary); margin-bottom: 10px; border-bottom: 2px solid var(--primary); padding-bottom: 5px; display: flex; align-items: center; gap: 5px; }
        .dice-area { text-align: center; }
        .dice-box { font-size: 2.5rem; margin: 10px 0; background: #fdf5e6; border: 2px dashed var(--accent); border-radius: 8px; padding: 10px; }
        /* 퀴즈 모달 스타일 */
        #quiz-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; }
        .quiz-content { background: white; padding: 30px; border-radius: 12px; width: 90%; max-width: 500px; border: 3px solid var(--primary); box-shadow: 0 5px 25px rgba(0,0,0,0.3); }
        .quiz-content h3 { color: var(--primary); margin-bottom: 15px; font-size: 1.3rem; }
        .quiz-question { font-size: 1.1rem; margin-bottom: 20px; line-height: 1.5; font-weight: bold; }
        .quiz-options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .quiz-opt-btn { background: #fdf5e6; border: 1px solid var(--tile-border); padding: 12px; border-radius: 6px; text-align: left; cursor: pointer; font-size: 0.95rem; transition: background 0.2s; }
        .quiz-opt-btn:hover { background: #faebd7; }
    </style>
</head>
<body>
    <header>
        <h1>🏯 조선시대 역사 블루마블 (임진왜란과 병자호란)</h1>
        <p>30문항 학습지 기반 멀티플레이 역사 복습 게임</p>
    </header>
    <div class="container">
        <!-- 로비 화면 -->
        <div id="lobby-screen">
            <h2>방 입장하기</h2>
            <div class="input-group">
                <label>방 번호 (Room ID)</label>
                <input type="text" id="room-input" value="class3">
            </div>
            <div class="input-group">
                <label>이름 (닉네임)</label>
                <input type="text" id="name-input" placeholder="이름을 입력하세요">
            </div>
            <button class="btn" id="join-btn">게임 참여하기</button>
        </div>

        <!-- 게임 메인 화면 -->
        <div id="game-screen" style="display: none;">
            <div class="board-container" id="board"></div>
            <div class="control-panel">
                <div class="panel-box">
                    <div class="status-header">🎲 주사위 통제소</div>
                    <div class="dice-area">
                        <div id="dice-display" class="dice-box">🎲 대기 중</div>
                        <div id="player-pos-text" style="margin-bottom: 10px; font-weight: bold;">현재 위치: 한양 (0번 칸)</div>
                        <button class="btn" id="roll-dice-btn">주사위 던지기</button>
                    </div>
                </div>
                <div class="panel-box">
                    <div class="status-header">⚔️ 전쟁 현황</div>
                    <div id="player-status-list">참여 완료!</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 퀴즈 팝업 모달 -->
    <div id="quiz-modal">
        <div class="quiz-content">
            <h3 id="quiz-title">📜 역사 출제 문제</h3>
            <div class="quiz-question" id="quiz-q-text">문제가 여기에 표시됩니다.</div>
            <div class="quiz-options" id="quiz-options-container">
                <!-- 보기 버튼들이 동적으로 들어갑니다 -->
            </div>
        </div>
    </div>

    <script>
        // 30문항 학습지 데이터 연동 보드판 구성
        const boardTiles = [
            { id: 0, name: "한양 (광화문)", type: "start", icon: "🏯" },
            { id: 1, name: "동아시아 정세", type: "quiz", icon: "📜", qIndex: 0 },
            { id: 2, name: "평양성 탈환", type: "quiz", icon: "🏰", qIndex: 1 },
            { id: 3, name: "왜란 침략 구실", type: "quiz", icon: "📜", qIndex: 2 },
            { id: 4, name: "왜란 초기 전개", type: "quiz", icon: "📜", qIndex: 3 },
            { id: 5, name: "의병의 활동", type: "quiz", icon: "📜", qIndex: 4 },
            { id: 6, name: "난중일기 기록", type: "quiz", icon: "📜", qIndex: 5 },
            { id: 7, name: "한산도 대첩", type: "quiz", icon: "🚢", qIndex: 6 },
            { id: 8, name: "수군 승전지", type: "quiz", icon: "🚢", qIndex: 7 },
            { id: 9, name: "판옥선과 거북선", type: "quiz", icon: "🚢", qIndex: 8 },
            { id: 10, name: "육상 전투와 인물", type: "quiz", icon: "🏯", qIndex: 9 },
            { id: 11, name: "전쟁 주요 사건 순서", type: "quiz", icon: "📜", qIndex: 10 },
            { id: 12, name: "휴전 기간 조선의 활동", type: "quiz", icon: "📜", qIndex: 11 },
            { id: 13, name: "노량해전과 왜란 종결", type: "quiz", icon: "🚢", qIndex: 12 },
            { id: 14, name: "왜란이 끼친 영향", type: "quiz", icon: "📜", qIndex: 13 },
            { id: 15, name: "조선통신사 파견", type: "quiz", icon: "📜", qIndex: 14 },
            { id: 16, name: "광해군의 복구 정책", type: "quiz", icon: "📜", qIndex: 15 },
            { id: 17, name: "후금의 건국", type: "quiz", icon: "📜", qIndex: 16 },
            { id: 18, name: "광해군 중립외교", type: "quiz", icon: "📜", qIndex: 17 },
            { id: 19, name: "인조반정의 구실", type: "quiz", icon: "📜", qIndex: 18 },
            { id: 20, name: "인조 정권의 외교 정책", type: "quiz", icon: "📜", qIndex: 19 },
            { id: 21, name: "이괄의 난", type: "quiz", icon: "📜", qIndex: 20 },
            { id: 22, name: "정묘호란 발발", type: "quiz", icon: "📜", qIndex: 21 },
            { id: 23, name: "후금과의 관계", type: "quiz", icon: "📜", qIndex: 22 },
            { id: 24, name: "주화론과 척화론", type: "quiz", icon: "📜", qIndex: 23 },
            { id: 25, name: "남한산성 피신", type: "quiz", icon: "🏯", qIndex: 24 },
            { id: 26, name: "삼전도의 굴욕", type: "quiz", icon: "📜", qIndex: 25 },
            { id: 27, name: "북벌 운동", type: "quiz", icon: "📜", qIndex: 26 },
            { id: 28, name: "북학론 대두", type: "quiz", icon: "📜", qIndex: 27 },
            { id: 29, name: "끌려갔다 돌아온 여성", type: "quiz", icon: "📜", qIndex: 28 },
            { id: 30, name: "하멜 일행과 조선 정착", type: "event", icon: "🐴", qIndex: 29 },
            { id: 31, name: "역사 복습 완료", type: "quiz", icon: "👑", qIndex: 0 }
        ];

        // 30문항 학습지 데이터베이스 (문제, 보기, 정답 인덱스)
        const quizDatabase = [
            { q: "16세기 중반 이후 동아시아 정세에 대한 설명으로 옳지 않은 것은?", opts: ["① 명에서는 환관과 외척의 횡포가 심해졌다.", "② 명은 몽골과 왜구의 침입으로 사회적 불안이 커졌다.", "③ 조선은 붕당 간 대립으로 정치적 혼란이 이어졌다.", "④ 일본에서는 도쿠가와 이에야스가 전국 시대를 통일하고 대륙 진출을 준비하였다."], ans: 3 },
            { q: "왜란 중 조선이 명에 지원을 요청하자 연합하여 일본군을 물리치고 탈환한 곳은?", opts: ["① 진주성", "② 행주산성", "③ 평양성", "④ 명량"], ans: 2 },
            { q: "일본이 조선을 침략하며 내세운 구실은?", opts: ["① 명을 정벌하러 가니 길을 빌려 달라는 것", "② 조선이 일본 사신을 해쳤다는 것", "③ 왜구 피해를 배상하라는 것", "④ 조선이 일본 상인의 무역을 금지했다는 것"], ans: 0 },
            { q: "왜란 초기의 전개 과정으로 옳지 않은 것은?", opts: ["① 부산진과 동래성이 함락되었다.", "② 신립이 충주에서 일본군을 크게 물리쳐 한성을 지켜 냈다.", "③ 선조는 광해군을 세자로 책봉하고 의주까지 피란하였다.", "④ 일본군은 20여 일 만에 한성을 점령하였다."], ans: 1 },
            { q: "곽재우 등 유생들이 농민을 모아 일으킨 의병에 대한 설명으로 옳은 것은?", opts: ["① 훈련도감 소속의 정규군으로 편성되었다.", "② 한산도 앞바다에서 일본 수군을 격파하였다.", "③ 승려들만 참여하여 승군이라고 불렸다.", "④ 익숙한 지리를 활용한 전술로 일본군의 보급로를 차단하였다."], ans: 3 },
            { q: "이순신이 왜란 동안 쓴 일기로 세계 기록 유산에 등재된 것은?", opts: ["① 난중일기", "② 징비록", "③ 조선왕조실록", "④ 동의보감"], ans: 0 },
            { q: "이순신이 이끈 수군이 서남해 제해권을 장악하고 보급로를 차단한 전투는?", opts: ["① 명량해전", "② 한산도 대첩", "③ 노량해전", "④ 행주대첩"], ans: 1 },
            { q: "이순신이 이끈 수군이 승리를 거둔 곳이 아닌 것은?", opts: ["① 옥포", "② 사천", "③ 행주산성", "④ 당포"], ans: 2 },
            { q: "조선의 판옥선과 거북선에 대한 설명으로 옳은 것은?", opts: ["① 판옥선은 바닥이 뾰족하여 속도가 매우 빨랐다.", "② 일본 전선은 가벼워서 포 공격에도 잘 견뎠다.", "③ 판옥선은 회전이 어려워 한 방향으로만 공격할 수 있었다.", "④ 판옥선에 지붕을 덮어 만든 거북선은 돌격선의 역할을 하였다."], ans: 3 },
            { q: "왜란 때의 육상 전투와 인물의 연결로 옳은 것은?", opts: ["① 김시민 – 진주성, 권율 – 행주산성", "② 김시민 – 행주산성, 권율 – 진주성", "③ 곽재우 – 평양성, 신립 – 진주성", "④ 신립 – 행주산성, 이순신 – 진주성"], ans: 0 },
            { q: "(가) 부산진·동래성 공격 (나) 한산도 대첩 (다) 정유재란 (라) 노량해전 순서는?", opts: ["① (가)-(다)-(나)-(라)", "② (나)-(가)-(다)-(라)", "③ (가)-(나)-(다)-(라)", "④ (가)-(나)-(라)-(다)"], ans: 2 },
            { q: "휴전 기간(3년)에 조선이 한 일로 옳지 않은 것은?", opts: ["① 훈련도감 설치", "② 균역법 시행", "③ 화포 개량", "④ 조총 제작"], ans: 1 },
            { q: "도요토미 히데요시 사망 후 철수하던 일본군을 무찌르며 왜란이 끝난 전투는?", opts: ["① 옥포 해전", "② 한산도 대첩", "③ 명량해전", "④ 노량해전"], ans: 3 },
            { q: "왜란이 끼친 영향으로 옳지 않은 것은?", opts: ["① 명은 전쟁으로 국력이 강해져 만주의 여진족을 압도하였다.", "② 조선에서는 토지가 황폐해지고 국가 재정이 어려워졌다.", "③ 조선의 궁궐과 사고가 불타고 문화재를 약탈당하였다.", "④ 일본은 끌고 간 성리학자·인쇄공·도공 등을 통해 문화 발전의 계기를 마련하였다."], ans: 0 },
            { q: "도쿠가와 이에야스의 요청으로 조선이 파견한 사절단은?", opts: ["① 영선사", "② 보빙사", "③ 조선통신사", "④ 수신사"], ans: 2 },
            { q: "왜란 후 광해군의 복구 정책으로 옳은 것은?", opts: ["① 성곽과 무기를 없애 군사비를 줄였다.", "② 토지 대장과 호적을 정비하여 국가 재정 수입을 늘렸다.", "③ 후금과 군신 관계를 맺었다.", "④ 명과의 외교 관계를 끊었다."], ans: 1 },
            { q: "광해군 때 여진족을 통합하여 후금을 세운 인물은?", opts: ["① 청 태종", "② 도요토미 히데요시", "③ 도쿠가와 이에야스", "④ 누르하치"], ans: 3 },
            { q: "광해군의 중립외교에 대한 설명으로 옳지 않은 것은?", opts: ["① 의리와 명분을 중시한 서인은 광해군의 외교 정책을 적극 지지하였다.", "② 후금이 명이 공격하자 명이 조선에 군사 지원을 요청하였다.", "③ 광해군은 강홍립을 파견하며 상황에 맞게 대응하도록 하였다.", "④ 명이 후금에 패하자 강홍립은 후금에 투항하였다."], ans: 0 },
