<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>조선시대 역사 블루마블 - 교사용 대시보드</title>
    <style>
        :root { --primary: #8b0000; --bg-color: #f4ebd0; --text-dark: #2c2c2c; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Malgun Gothic', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-dark); padding: 20px; }
        header { text-align: center; margin-bottom: 25px; }
        header h1 { font-size: 2rem; color: var(--primary); }
        .container { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        .card { background: white; border: 2px solid #8b5a2b; border-radius: 8px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .card h3 { color: var(--primary); margin-bottom: 15px; border-bottom: 2px solid var(--primary); padding-bottom: 8px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #fdf5e6; color: var(--primary); }
    </style>
</head>
<body>
    <header>
        <h1>📜 조선시대 역사 블루마블 - 교사 통제 대시보드</h1>
        <p>실시간 학생 접속 및 전쟁 현황 모니터링</p>
    </header>
    <div class="container">
        <div class="card">
            <h3>⚔️ 전쟁 현황 (실시간 모니터링)</h3>
            <table>
                <thead>
                    <tr><th>참여 번호</th><th>학생 이름</th><th>현재 위치</th><th>공훈 점수</th><th>제어</th></tr>
                </thead>
                <tbody>
                    <tr><td colspan="5" style="color: #777;">연결된 학생 대기 중...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
